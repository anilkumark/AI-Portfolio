[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-graph-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "neo4j>=5.24",
    "openai>=1.50",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "ragas>=0.2",
    "requests>=2.32",
        "pypdf>=4.0",
        "ragas>=0.2,<0.3",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
        "streamlit>=1.38",


]

[tool.setuptools.packages.find]
where = ["src"]
