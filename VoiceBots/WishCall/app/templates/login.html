{% extends "_auth_base.html" %}
{% block title %}Sign in · WishCall{% endblock %}
{% block content %}
{% if error %}<div class="flash bad" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <div class="field">
    <label for="pw">Password</label>
    <input class="input" id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  </div>
  <button class="btn primary block" type="submit" style="margin-top:18px">Sign in</button>
</form>
{% endblock %}
